<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>PulseQuest</title>
  <meta name="theme-color" content="#0f0a2a" />
  <meta name="description" content="Gamified blood pressure and heart rate tracker" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PulseQuest" />
  <script>
    // apply saved theme before first paint (no flash)
    try {
      var s = JSON.parse(localStorage.getItem('pulsequest-settings') || '{}');
      var dark = s.theme === 'light' ? false : s.theme === 'dark' ? true : matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.className = dark ? 'dark' : '';
    } catch (e) {}
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/main.jsx"></script>
</body>
</html>
